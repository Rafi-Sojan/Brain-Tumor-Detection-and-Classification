
name: Model Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "configs/**"
      - "tests/**"
      - "models/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate dataset and model utilities
        run: |
          pytest -q tests
